name: Build and create release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singlepass-release-master

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    env:
      PROJECT_PATH: .\SinglePass.WPF\SinglePass.WPF.csproj
      CONFIGURATION: Release
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Restore
      run: msbuild $env:PROJECT_PATH /t:Restore /p:Configuration=$env:CONFIGURATION
    - name: Determine release version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/scripts/Get-ReleaseVersion.ps1
    - name: Write OAuth client settings
      if: steps.version.outputs.published == 'false'
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
      run: |
        if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
          Write-Error 'GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets are required.'
          exit 1
        }
        $settings = @{ GoogleDriveConfig = @{ ClientId = $env:GOOGLE_CLIENT_ID; ClientSecret = $env:GOOGLE_CLIENT_SECRET } }
        if ($env:YANDEX_CLIENT_ID) { $settings.YandexDiskConfig = @{ ClientId = $env:YANDEX_CLIENT_ID } }
        @{ Settings = $settings } | ConvertTo-Json -Depth 5 | Set-Content -Path .\SinglePass.WPF\settings.secrets.json -Encoding utf8
    - name: Publish application
      if: steps.version.outputs.published == 'false'
      run: msbuild $env:PROJECT_PATH /t:Publish /p:Configuration=$env:CONFIGURATION /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishReadyToRun=true /p:PublishSingleFile=true
    - name: Create ZIP archive
      if: steps.version.outputs.published == 'false'
      env:
        ARCHIVE: ${{ steps.version.outputs.archive }}
      run: Compress-Archive -Path '.\SinglePass.WPF\bin\Release\win-x64\publish\' -DestinationPath $env:ARCHIVE
    - name: Create GitHub Release
      if: steps.version.outputs.published == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        ARCHIVE: ${{ steps.version.outputs.archive }}
        RELEASE_DRAFT: ${{ steps.version.outputs.draft }}
      run: |
        if ($env:RELEASE_DRAFT -eq 'true') {
          gh release upload $env:RELEASE_TAG $env:ARCHIVE --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false
        } else {
          gh release create $env:RELEASE_TAG $env:ARCHIVE --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes
        }
