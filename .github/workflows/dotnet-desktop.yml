name: Build and create release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erapkey-release-master

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    env:
      PROJECT_PATH: .\Erapkey.Desktop\Erapkey.Desktop.csproj
      CONFIGURATION: Release
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Restore
      run: msbuild $env:PROJECT_PATH /t:Restore /p:Configuration=$env:CONFIGURATION
    - name: Determine release version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/scripts/Get-ReleaseVersion.ps1
    - name: Write OAuth client settings
      if: steps.version.outputs.published == 'false'
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
      run: |
        if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
          Write-Error 'GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets are required.'
          exit 1
        }
        $settings = @{ GoogleDriveConfig = @{ ClientId = $env:GOOGLE_CLIENT_ID; ClientSecret = $env:GOOGLE_CLIENT_SECRET } }
        if ($env:YANDEX_CLIENT_ID) { $settings.YandexDiskConfig = @{ ClientId = $env:YANDEX_CLIENT_ID } }
        @{ Settings = $settings } | ConvertTo-Json -Depth 5 | Set-Content -Path .\Erapkey.Desktop\settings.secrets.json -Encoding utf8
    - name: Publish application
      if: steps.version.outputs.published == 'false'
      run: msbuild $env:PROJECT_PATH /t:Publish /p:Configuration=$env:CONFIGURATION /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishReadyToRun=true /p:PublishSingleFile=true
    - name: Install Velopack CLI
      if: steps.version.outputs.published == 'false'
      run: dotnet tool install -g vpk --version 1.2.161
    - name: Download previous release for delta updates
      if: steps.version.outputs.published == 'false'
      env:
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir .\Releases
        if ($LASTEXITCODE -ne 0) { Write-Warning 'No previous Velopack release found; only a full package will be built.' }
        exit 0
    - name: Pack Velopack release
      if: steps.version.outputs.published == 'false'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      # packId must differ from "Erapkey": %LocalAppData%\Erapkey holds the user's vault,
      # and Velopack deletes its install folder (%LocalAppData%\<packId>) on uninstall.
      run: >
        vpk pack
        --packId Erapkey.App
        --packVersion $env:VERSION
        --packDir .\Erapkey.Desktop\bin\Release\win-x64\publish
        --mainExe Erapkey.exe
        --packTitle Erapkey
        --packAuthors "Andrey Nasonov"
        --icon .\Erapkey.Desktop\Resources\pass-man.ico
        --outputDir .\Releases
    - name: Upload GitHub Release
      if: steps.version.outputs.published == 'false'
      env:
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        # Uploads Setup.exe, Portable.zip, nupkg packages and the update feed into a draft release
        vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir .\Releases --tag $env:RELEASE_TAG --releaseName $env:RELEASE_TAG --targetCommitish $env:GITHUB_SHA --merge
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$env:RELEASE_TAG -f target_commitish=$env:GITHUB_SHA --jq .body > release-notes.md
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        gh release edit $env:RELEASE_TAG --draft=false --notes-file release-notes.md
