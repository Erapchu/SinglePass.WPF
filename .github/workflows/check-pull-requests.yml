name: Check pull-requests

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
        matrix:
          configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    
    env:
      SOLUTION_NAME: Erapkey.sln
      PROJECT_PATH: .\Erapkey\Erapkey.csproj
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
        
    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.3.1
      
    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore
      run: |
       msbuild $env:PROJECT_PATH /t:Restore /p:Configuration=$env:CONFIGURATION
      env:
        Configuration: ${{ matrix.configuration }}

    # Build the application to populate the bin folder
    - name: Build
      run: |
       msbuild $env:PROJECT_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:RuntimeIdentifier=win-x64
      env:
        Configuration: ${{ matrix.configuration }}

    # The browser extension: type check, build, and the Node client that BrowserExtensionInteropTests runs.
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: extension/package-lock.json

    - name: Build extension
      working-directory: extension
      run: |
       npm ci
       npm run typecheck
       npm run build
       node build.mjs --test

    - name: Test
      run: |
       dotnet test .\Erapkey.Core.Tests\Erapkey.Core.Tests.csproj --configuration $env:CONFIGURATION
      env:
        Configuration: ${{ matrix.configuration }}